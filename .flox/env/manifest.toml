schema-version = "1.12.0"
minimum-cli-version = "1.12.0"


[install]

# Rust toolchain, yes this version number is for the entire toolchain!
rust-toolchain.flake = "github:cmn-code/nix#rust-1_96_0"

# Build dependencies
gcc.pkg-path = "gcc"
gcc.outputs = "all"
gcc.systems = ["aarch64-linux", "x86_64-linux"]
libiconv.pkg-path = "libiconv"
libiconv.systems = ["aarch64-darwin", "x86_64-darwin"]
libiconv.outputs = "all"
clang.pkg-path = "clang"
clang.systems = ["aarch64-darwin", "x86_64-darwin"]
pkg-config.pkg-path = "pkg-config"
pkg-config.outputs = "all"
openssl.pkg-path = "openssl"
openssl.outputs = "all"

# Useful development tools
just.pkg-path = "just"
just.outputs = "all"
watchexec.pkg-path = "watchexec"

# Used by docs/EXAMPLE.md: generating keys, calling the API, parsing responses
curl.pkg-path = "curl"
jq.pkg-path = "jq"
python3.pkg-path = "python3"

# Platform-specific packages


## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]
# This makes cargo installation local to the flox environment
CARGO_HOME = "$FLOX_ENV_PROJECT/.flox/cache/cargo"
RUSTUP_HOME = "$FLOX_ENV_PROJECT/.flox/cache/rustup"

## Activation Hook ---------------------------------------------------
##  ... run by _bash_ shell when you run 'flox activate'.
## -------------------------------------------------------------------
[hook]
on-activate = '''

  export PATH="$CARGO_HOME/bin:$PATH"

  # Fix for cargo issues with LD_AUDIT on flox (https://github.com/flox/flox/issues/1341#issuecomment-2067207817)
  unset LD_AUDIT

  # Install stable toolchain if not present
  # if [ ! -d "$RUSTUP_HOME/toolchains" ]; then
  #   echo "Installing stable toolchain to project directory..."
  #   rustup toolchain install stable
  #   rustup default stable
  #   echo "Stable toolchain installed"
  # fi

  # diesel_cli isn't in nixpkgs in a sqlite-only build, so install it via
  # cargo instead. sqlite-bundled compiles SQLite from vendored source, so
  # this needs no system sqlite package.
  if ! command -v diesel >/dev/null 2>&1; then
    echo "Installing diesel_cli..."
    cargo install diesel_cli --no-default-features --features sqlite-bundled
    echo "diesel_cli installed"
  fi

  echo "-> Run 'just' to see all available commands."
  echo "Rust:   $(rustc --version)"
'''

[profile]
[services]
[include]
[build]

[build.wowauth]
command = '''
  just build
  mkdir -p $out/bin
  cp target/x86_64-unknown-linux-musl/release/wowauth $out/bin/wowauth
'''
version = "0.0.1"
description = "Wow, OAuth so simple!"
sandbox = "off"

[options]
