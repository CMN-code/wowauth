        "outputs": "all"
      },
      "rustup": {
        "pkg-path": "rustup"
      },
      "watchexec": {
        "pkg-path": "watchexec"
      }
    },
    "vars": {
      "CARGO_HOME": "$FLOX_ENV_PROJECT/.flox/cache/cargo",
      "PATH": "$CARGO_HOME/bin:$PATH",
      "RUSTUP_HOME": "$FLOX_ENV_PROJECT/.flox/cache/rustup"
    },
    "hook": {
      "on-activate": "  # Fix for cargo issues with LD_AUDIT on flox (https://github.com/flox/flox/issues/1341#issuecomment-2067207817)\n  unset LD_AUDIT\n\n  # Install stable toolchain if not present\n  if [ ! -d \"$RUSTUP_HOME/toolchains\" ]; then\n    echo \"Installing stable toolchain to project directory...\"\n    rustup toolchain install stable\n    rustup default stable\n    echo \"Stable toolchain installed\"\n  fi\n\n  echo \"You are now floxed up!\"\n  echo \"-> Run 'just' to see all available commands.\"\n  echo \"Rust: $(rustc --version)\"\n"
    },
    "profile": {},
    "options": {}
  },
