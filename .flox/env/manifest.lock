    "vars": {
      "CARGO_HOME": "$FLOX_ENV_PROJECT/.flox/cache/cargo",
      "PATH": "$CARGO_HOME/bin:$PATH",
      "RUSTUP_HOME": "$FLOX_ENV_PROJECT/.flox/cache/rustup"
    },
    "hook": {
      "on-activate": "  # Fix for cargo issues with LD_AUDIT on flox (https://github.com/flox/flox/issues/1341#issuecomment-2067207817)\n  unset LD_AUDIT\n\n  # Install stable toolchain if not present\n  if [ ! -d \"$RUSTUP_HOME/toolchains\" ]; then\n    echo \"Installing stable toolchain to project directory...\"\n    rustup toolchain install stable\n    rustup default stable\n    echo \"Stable toolchain installed\"\n  fi\n\n  # diesel_cli isn't in nixpkgs in a sqlite-only build, so install it via\n  # cargo instead. sqlite-bundled compiles SQLite from vendored source, so\n  # this needs no system sqlite package.\n  if ! command -v diesel >/dev/null 2>&1; then\n    echo \"Installing diesel_cli...\"\n    cargo install diesel_cli --no-default-features --features sqlite-bundled\n    echo \"diesel_cli installed\"\n  fi\n\n  echo \"You are now floxed up!\"\n  echo \"-> Run 'just' to see all available commands.\"\n  echo \"Rust: $(rustc --version)\"\n"
    },
    "profile": {},
    "options": {}
  },
