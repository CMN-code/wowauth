  "manifest": {
    "schema-version": "1.12.0",
    "minimum-cli-version": "1.12.0",
    "install": {
      "cargo-nextest": {
        "pkg-path": "cargo-nextest"
      },
      "gcc": {
        "pkg-path": "gcc",
        "outputs": "all"
      },
      "just": {
        "pkg-path": "just",
        "outputs": "all"
      },
      "libiconv": {
        "pkg-path": "libiconv",
        "systems": [
          "aarch64-darwin",
          "x86_64-darwin"
