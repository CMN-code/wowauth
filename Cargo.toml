[package]
name = "wowauth"
version = "0.1.0"
authors = ["Elias Groot <elias@definedonce.com>", "Max Gallup <max@definedonce.com>"]
description = "Standalone OAuth 2.0 authorization server"
edition = "2024"
license = "MIT"
repository = "https://github.com/CMN-code/wowauth"

[dependencies]
# Server & Runtime
poem = "3.1.12"
tokio = { version = "1.0", features = ["full"] }

# OAuth
oauth2 = "5.0.0"

# Serde
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Introspection
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
